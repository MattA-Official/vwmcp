[package]
name = "vwmcp"
version = "0.3.0"
description = "MCP server for Vectorworks: a single Windows binary with one-click setup"
license = "MIT"
authors = ["Matt Adcock <git@matt-is.gay>"]
repository = "https://github.com/MattA-Official/vwmcp"
homepage = "https://github.com/MattA-Official/vwmcp"
readme = "README.md"
keywords = ["mcp", "vectorworks", "cad", "claude", "model-context-protocol"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "system-proxy"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
